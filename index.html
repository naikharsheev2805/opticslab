<style>

:root[data-theme=dark]{--bg:#262624;--sf:#30302E;--bd:#443F3B;--tx:#F0EEE6;--mu:#A8A59C;--cv:#1F1E1D;--dt:#4B4943;--sh:none}

.tab{border:0;background:none;color:var(--mu);padding:7px 14px;border-radius:9px;font:inherit;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.08)}
button{font:inherit;color:var(--tx);cursor:pointer}
.b{border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:6px 11px}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}.pri:hover{background:var(--ad)}

.hint{position:absolute;left:14px;bottom:10px;font-size:12px;color:var(--mu);pointer-events:none}
#side,#ref{display:flex;flex-direction:column;gap:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1px solid var(--bd);background:var(--bg);border-radius:99px;padding:4px 11px;font-size:13px}
.chip:hover{border-color:var(--ac)}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sl{display:grid;grid-template-columns:1fr auto;gap:0 8px;margin:7px 0;font-size:13px;color:var(--mu)}
.sl input{grid-column:1/3;width:100%;accent-color:var(--ac);margin:2px 0}.sl .v{color:var(--tx);font-variant-numeric:tabular-nums}
.tg{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.tg input{accent-color:var(--ac);width:16px;height:16px}
.r{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--bd);font-size:13px}.r:last-child{border:0}.r span{color:var(--mu)}.r b{font-weight:500;text-align:right}
select,input[type=number]{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:5px 8px;width:100%}
#ref{max-width:900px;margin:0 auto;padding:0 16px 30px}#ref p,#ref li{color:var(--mu);margin:3px 0}#ref b{color:var(--tx);font-weight:500}#ref ul{padding-left:18px;margin:0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.fr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
#side .card h3{cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;margin:0}

#app.np{grid-template-columns:1fr!important}#app.np #side{display:none}

@media(min-width:700px) and (orientation:landscape){#app{grid-template-columns:minmax(0,1fr) clamp(300px,28vw,470px);height:calc(100vh - 78px);padding-bottom:12px;align-items:stretch}body.fs #app{height:calc(100vh - 48px)}#app>section,.cvw{height:100%}#side{height:100%;overflow-y:auto;padding:0 2px 2px 0}}

.tl{color:var(--mu);font:italic 16px ui-serif,Georgia,serif}@media(max-width:700px){.tl{display:none}}

@media(max-width:860px){#nv{flex-direction:column;overflow-x:visible;overflow-y:auto;max-height:36vh;padding:0 12px 8px}.ni{white-space:normal;border:0;border-radius:9px;background:none}}

@media(max-width:860px) and (min-width:700px){#shell{grid-template-columns:200px minmax(0,1fr)}#nv{position:sticky;top:0;max-height:calc(100vh - 70px);overflow-y:auto;overflow-x:hidden;flex-direction:column;padding:4px 6px 20px 12px}}
@media(max-width:699px){#mb{display:inline-block}#shell{grid-template-columns:1fr}#nv{position:fixed;z-index:20;top:0;left:0;bottom:0;width:min(310px,86vw);max-height:none;background:var(--sf);border-right:1px solid var(--bd);box-shadow:0 0 40px rgba(0,0,0,.25);padding:calc(16px + env(safe-area-inset-top,0px)) 10px 24px;transform:translateX(-105%);transition:transform .24s ease;overflow-y:auto;flex-direction:column}body.nvo #nv{transform:none}body.nvo #scrim{display:block}}
</style></head><body>

const TP={plane:()=>({els:[mk.mirror({x:60,R:0,h:16})],src:{t:'arrow',x:25,h:5}}),conc:()=>({els:[mk.mirror({x:85,R:40,h:12})],src:{t:'arrow',x:30,h:5}}),conv:()=>({els:[mk.mirror({x:75,R:-40,h:12})],src:{t:'arrow',x:25,h:5}}),cvx:()=>({els:[mk.lens({x:45})],src:{t:'candle',x:5,h:5}}),ccv:()=>({els:[mk.lens({x:45,R1:-20,R2:20})],src:{t:'arrow',x:5,h:5}}),pcx:()=>({els:[mk.lens({x:45,R1:12,R2:0})],src:{t:'tree',x:5,h:5}}),two:()=>({els:[mk.lens({x:30}),mk.lens({x:62,R1:15,R2:-15,h:6})],src:{t:'arrow',x:-5,h:4}})};
const TN={plane:'The image is virtual, erect, the same size, and as far behind the mirror as the object is in front. Rotate the mirror: the reflected ray turns by twice the angle.',conc:'1/v + 1/u = 1/f, with f = R/2. Drag the arrow: beyond C the image is real, inverted and smaller; between F and C real, inverted and larger; inside F virtual, erect and larger.',conv:'A convex mirror always gives a virtual, erect, diminished image, which is why it is used as a rear-view mirror.',cvx:'An object at 2F gives a real, inverted image of the same size at 2F. Drag the candle to see how v and m change.',ccv:'A concave lens always gives a virtual, erect, diminished image between the lens and its focus.',pcx:'Plano-convex lens: 1/f = (n − 1)/R. Swap R₁ and R₂ in the lens controls: the focal length stays the same.',two:'Two lenses: 1/F = 1/f₁ + 1/f₂ − d/(f₁f₂). Drag the second lens and watch the final image move.'};

 {g:'Reflection of light',c:[tt('plane','Plane mirror'),tt('conc','Concave mirror'),tt('conv','Convex mirror')]},
 {g:'Refraction & TIR',c:[pp('slab','Glass slab · lateral shift'),pp('tir','Total internal reflection')]},
 {g:'Lenses',c:[tt('cvx','Convex lens'),tt('ccv','Concave lens'),tt('pcx','Plano-convex lens'),tt('two','Two-lens combination')]},
 {g:'Prism & dispersion',c:[pp('disp','Dispersion & spectrum'),pp('mind','Minimum deviation'),pp('thin','Thin prism')]},
 {g:'Optical instruments',c:[{g:'Microscopes',c:[ii('simple'),ii('comp')]},{g:'Telescopes',c:[ii('astro'),ii('terr'),ii('gal'),ii('cass')]}]},
 {g:'The human eye',c:[ii('eye')]},
 {id:'quests',g:'Quests · '+nq+'/'+Q.length,c:Q.map((q,i)=>['q:'+i,(QD[i]?'✓ ':'')+q.t])},['ref','Formulae']]};
nav=function(){const n=$('#nv');n.innerHTML='';const R=(l,d)=>l.forEach(x=>{if(Array.isArray(x)){const b=E('button','ni'+(NV==x[0]?' on':''),x[1]);b.style.paddingLeft=(10+d*14)+'px';b.onclick=()=>nvGo(x[0]);n.append(b);return}const id=x.id||x.g,o=OPEN.has(id),h=E('button','nh'+(o?' op':''),x.g);h.style.paddingLeft=(10+d*14)+'px';if(d)h.style.fontWeight=400;h.onclick=()=>{o?OPEN.delete(id):OPEN.add(id);nav()};n.append(h);if(o)R(x.c,d+1)});R(T(),0)};
nvGo=function(k){const[a,b]=k.split(':'),A=SC.sand;V.white=0;sel=null;if((a=='t'||a=='q')&&!OW){UB=cl({e:A.els,s:A.src,n:A.nr});OW=1}if(a=='sand'&&OW&&UB){A.els=UB.e;A.src=UB.s;A.nr=UB.n;A.fd=0;OW=0}openPath(T(),k);if(a=='q'){quest(+b);return}QA=null;NV=k;
 if(a=='sand')tab='sand';else if(a=='t'){loadT(b);tab='sand'}else if(a=='i'){setIN(b);SC.inst.fd=0;tab='inst'}else if(a=='p'){Object.assign(PP,PRS[b][1]);V.white=PRS[b][2];SC.prism.fd=0;tab='prism'}else tab='ref';go()};
questUI=function(c){const p=c.parentNode,h=p.firstChild,t=NV[0]=='t'?TN[NV.slice(2)]:null,st='<p style="margin:0;color:var(--mu)">';p.style.display='';if(QA!=null){h.textContent='Quest goal';c.innerHTML=st+Q[QA].d+'</p>'}else if(t){h.textContent='About this setup';c.innerHTML=st+t+'</p>'}else p.style.display='none'};
/* formulas */
$('#ref').innerHTML=`<div class=card><h3>Live calculator</h3><div class=g2><div><div class=fr><select id=ct><option value=m>Mirror</option><option value=l>Lens</option></select><input id=cu type=number value=-30 step=any><input id=cf type=number value=20 step=any></div><p>Type, object distance u (negative, Cartesian), focal length f (+ concave mirror / convex lens)</p><div id=co class=r></div></div>
<div><div class=fr><input id=pa type=number value=60 placeholder=A><input id=pn type=number value=1.5 step=.01><input id=pi type=number value=40></div><p>Prism: apex A, index n, incidence i (°)</p><div id=po class=r></div></div></div></div>
<div class=g2><div class=card><h3>Reflection &amp; refraction</h3><ul><li><b>Mirror:</b> 1/v + 1/u = 1/f, f = R/2, m = −v/u</li><li><b>Snell:</b> n₁ sin i = n₂ sin r, n = c/v</li><li><b>Critical angle:</b> sin θc = n₂/n₁</li><li><b>Apparent depth:</b> d' = d/n</li><li><b>Slab shift:</b> t sin(i−r)/cos r</li><li><b>Single surface:</b> n₂/v − n₁/u = (n₂−n₁)/R</li></ul></div>
<div class=card><h3>Lenses</h3><ul><li><b>Lens formula:</b> 1/v − 1/u = 1/f, m = v/u</li><li><b>Lens maker:</b> 1/f = (n−1)(1/R₁ − 1/R₂)</li><li><b>Medium:</b> 1/f = (nₗ/nₘ − 1)(1/R₁ − 1/R₂)</li><li><b>Power:</b> P = 1/f (m) in dioptre</li><li><b>Contact:</b> 1/F = 1/f₁ + 1/f₂, P = P₁ + P₂</li><li><b>Separated:</b> 1/F = 1/f₁ + 1/f₂ − d/(f₁f₂)</li><li><b>Cut lens:</b> halving across the axis keeps f; cutting along it doubles f</li></ul></div>
<div class=card><h3>Prism</h3><ul><li><b>δ = i + e − A</b>, r₁ + r₂ = A</li><li><b>Minimum deviation:</b> n = sin((A+δm)/2) / sin(A/2)</li><li><b>Thin prism:</b> δ = (n−1)A</li><li><b>Dispersive power:</b> ω = (n_v − n_r)/(n_y − 1)</li><li><b>Cauchy:</b> n = A + B/λ²</li></ul></div>
<div class=card><h3>Instruments</h3><ul><li><b>Simple microscope:</b> M = 1 + D/f (image at D), D/f (at ∞)</li><li><b>Compound microscope:</b> M = (v₀/u₀)(1 + D/fₑ), M ≈ (L/f₀)(D/fₑ)</li><li><b>Astronomical:</b> M = −f₀/fₑ, L = f₀ + fₑ</li><li><b>Galilean:</b> M = f₀/|fₑ|, L = f₀ − |fₑ|</li><li><b>Terrestrial:</b> M = f₀/fₑ, L = f₀ + 4f + fₑ</li><li><b>Cassegrain:</b> F = m·fₚ, M = F/fₑ</li><li><b>Resolving power:</b> telescope D/1.22λ, microscope 2n sinθ/1.22λ</li></ul></div></div>
<p>Sign convention: Cartesian, with light travelling along +x. Real-is-positive values appear in the Measurements panel.</p>`;
function calc(){const t=$('#ct').value,u=+$('#cu').value,f=+$('#cf').value,v=1/(t=='m'?1/f-1/u:1/f+1/u),m=t=='m'?-v/u:v/u,real=t=='m'?v<0:v>0;$('#co').innerHTML=isFinite(v)?`<span>v = ${v.toFixed(2)} · m = ${m.toFixed(2)}</span><b>${real?'real':'virtual'}, ${m<0?'inverted':'erect'}</b>`:'<span>Image at infinity</span>';
 const A=+$('#pa').value*RD,n=+$('#pn').value,i=+$('#pi').value*RD,s=n*Math.sin(A/2),r1=Math.asin(Math.sin(i)/n),x=n*Math.sin(A-r1);$('#po').innerHTML=`<span>δ_min = ${s<=1?(2*Math.asin(s)/RD-A/RD).toFixed(2)+'°':'—'}</span><b>${x>1?'TIR at 2nd face':'δ = '+((i+Math.asin(x)-A)/RD).toFixed(2)+'°'}</b>`}
document.querySelectorAll('#ref input,#ref select').forEach(e=>e.oninput=calc);calc();
go();(function L(){if(V.anim&&!document.hidden&&tab!='ref')draw();requestAnimationFrame(L)})();new ResizeObserver(()=>{if(tab!='ref'){size();draw()}}).observe(cv);
